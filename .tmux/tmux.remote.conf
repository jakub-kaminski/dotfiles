# show status bar at bottom for remote session,
# so it do not stack together with local session's one
set -g status-position bottom

# --- Clipboard sync (remote copy -> local X11 CLIPBOARD via OSC 52) ---
# This remote session runs under TERM=screen-256color, whose terminfo has NO 'Ms'
# (clipboard) capability, so tmux 'set-clipboard on' would emit nothing. Declare
# the clipboard feature explicitly so the remote tmux DOES emit OSC 52; the outer
# (local) tmux then captures it and re-emits to xterm, which writes the clipboard.
# set-clipboard is set first so a feature-flag parse error on an old remote tmux
# (< 3.2) cannot stop it from applying.
set -g set-clipboard on
set -ag terminal-features ",screen*:clipboard"

# --- Ctrl+Shift+Tab forwarding from a nested OUTER tmux ---
# When this is the inner/remote session of an F12-nested setup, the outer tmux
# (>=3.4) forwards Ctrl+Shift+Tab as a MODIFIED BACK-TAB sequence: ESC [ 1 ; 5 Z.
# tmux < 3.4 (e.g. 3.2a here) does not parse that sequence, so 'bind -n C-S-Tab'
# never fires and previous-window does nothing. (Ctrl+Tab is forwarded as ESC[9;5u
# which older tmux DOES decode, which is why next-window already works.)
# Map the raw forwarded bytes to previous-window via a user-key. Harmless on >=3.4
# (it just maps the same sequence to the same action). user-keys[0] is otherwise unused.
set -s user-keys[0] "\033[1;5Z"
bind -n User0 previous-window

#unbind -n C-j
#unbind -n C-k
#bind -n C-j if-shell next-window
#bind -n C-k if-shell previous-window

unbind -n C-j
unbind -n C-k

bind-key -n C-j next-window
bind-key -n C-k previous-window

# NOTE: the old netcat clipboard tunnel (port 19988) was removed — remote copy now
# always goes via OSC 52 (clip-copy), which needs no local listener. The matching
# `RemoteForward 19988` lines were also dropped from ~/.ssh/config.

# --- Claude Code usage widget (REMOTE sessions only) ---
# 5h + 7d limit %, reset countdown/clock, and today's $ spend — the numbers the i3
# bar shows on the local workstation, rendered for tmux. ToS-clean and READ-ONLY:
# a standalone consumer (~/.local/bin/claude-usage-tmux) that only reads the cache
# Claude Code's own statusLine harvested (~/.cache/claude-usage) + local ccusage
# logs. It does NOT touch the i3 claude-usage block. No token, no API call.
set -g status-right-length 200
wg_claude="#(~/.local/bin/claude-usage-tmux 2>/dev/null)"

# In remote mode we don't show "clock" and "battery status" widgets
set -g status-left "$wg_session"
set -g status-right "#{prefix_highlight} $wg_is_keys_off $wg_is_zoomed $wg_claude | #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_loadavg} | $wg_user_host | #{online_status}"
